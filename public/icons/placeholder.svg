<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 基底：深灰圆角矩形带内阴影效果 -->
  <rect width="96" height="96" rx="20" fill="#1F2937"/>
  <rect x="4" y="4" width="88" height="88" rx="16" fill="#374151" fill-opacity="0.5"/>
  
  <!-- 主窗口面板 -->
  <rect x="18" y="24" width="60" height="52" rx="8" fill="#4B5563"/>
  
  <!-- 窗口标题栏 -->
  <rect x="18" y="24" width="60" height="14" rx="8" fill="#6B7280"/>
  <rect x="18" y="32" width="60" height="6" fill="#6B7280"/>
  
  <!-- 标题栏按钮（状态点） -->
  <circle cx="28" cy="31" r="3" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="38" cy="31" r="3" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="48" cy="31" r="3" fill="#10B981" fill-opacity="0.8"/>
  
  <!-- 内容区域分栏 -->
  <rect x="22" y="42" width="18" height="30" rx="4" fill="#9CA3AF" fill-opacity="0.3"/>
  <rect x="44" y="42" width="30" height="14" rx="4" fill="#9CA3AF" fill-opacity="0.2"/>
  <rect x="44" y="60" width="30" height="12" rx="4" fill="#9CA3AF" fill-opacity="0.15"/>
  
  <!-- 侧边emerald强调条 -->
  <rect x="22" y="44" width="3" height="26" rx="1.5" fill="#10B981" fill-opacity="0.7"/>
</svg>
