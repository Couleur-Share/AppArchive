<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 圆角矩形背景 - 中性灰色 -->
  <rect width="96" height="96" rx="20" fill="#4B5563"/>
  
  <!-- 应用图标：简洁的软件图标设计 -->
  <!-- 外框 -->
  <rect x="24" y="24" width="48" height="48" rx="8" stroke="white" stroke-opacity="0.3" stroke-width="2" fill="none"/>
  
  <!-- 内部图形：代表窗口/应用 -->
  <rect x="30" y="30" width="36" height="8" rx="2" fill="white" fill-opacity="0.8"/>
  <rect x="30" y="42" width="16" height="24" rx="2" fill="white" fill-opacity="0.5"/>
  <rect x="50" y="42" width="16" height="11" rx="2" fill="white" fill-opacity="0.4"/>
  <rect x="50" y="57" width="16" height="9" rx="2" fill="white" fill-opacity="0.3"/>
</svg>
