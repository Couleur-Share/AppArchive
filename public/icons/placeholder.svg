<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 应用窗口图标 - 透明背景 -->
  
  <!-- 主窗口框架 -->
  <rect x="12" y="16" width="72" height="64" rx="8" stroke="#6B7280" stroke-width="4" fill="none"/>
  
  <!-- 标题栏分隔线 -->
  <line x1="12" y1="32" x2="84" y2="32" stroke="#6B7280" stroke-width="3"/>
  
  <!-- 窗口按钮 -->
  <circle cx="24" cy="24" r="4" fill="#9CA3AF"/>
  <circle cx="36" cy="24" r="4" fill="#9CA3AF"/>
  <circle cx="48" cy="24" r="4" fill="#9CA3AF"/>
  
  <!-- 内容区域 - 简化的界面元素 -->
  <rect x="20" y="40" width="24" height="4" rx="2" fill="#9CA3AF"/>
  <rect x="20" y="50" width="36" height="4" rx="2" fill="#6B7280"/>
  <rect x="20" y="60" width="28" height="4" rx="2" fill="#6B7280"/>
  <rect x="20" y="70" width="32" height="4" rx="2" fill="#6B7280"/>
</svg>
